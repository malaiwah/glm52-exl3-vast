name: build-and-push
on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, landing.py, "runpod-template*.json", sshd_config, "scripts/**", .github/workflows/build.yml]
  pull_request:
    paths: [Dockerfile, entrypoint.sh, landing.py, "runpod-template*.json", sshd_config, "scripts/**", .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: shellcheck entrypoint
        run: shellcheck entrypoint.sh
      - name: validate Python and Runpod template
        run: |
          python3 -m py_compile landing.py scripts/*.py
          PROFILE_VALIDATE_ONLY=1 MODEL_PROFILE=glm52-exl3 bash entrypoint.sh | grep -q '^REQUIRED_GPUS=4$'
          PROFILE_VALIDATE_ONLY=1 MODEL_PROFILE=qwen36-27b-nvfp4 bash entrypoint.sh | grep -q '^REQUIRED_GPUS=1$'
          PROFILE_VALIDATE_ONLY=1 MODEL_PROFILE=qwen36-27b-nvfp4 bash entrypoint.sh | grep -q '^MODEL_ID=nvidia/Qwen3.6-27B-NVFP4$'
          PROFILE_VALIDATE_ONLY=1 MODEL_PROFILE=custom MODEL_ID=org/model bash entrypoint.sh | grep -q '^MODEL_DIR=/workspace/models/org-model$'
          RUNPOD_POD_ID=test RUNPOD_TCP_PORT_8443=12345 RUNPOD_DIRECT_TLS=1 DESEC_TOKEN=test DESEC_DOMAIN=example.invalid PROFILE_VALIDATE_ONLY=1 MODEL_PROFILE=qwen36-27b-nvfp4 bash entrypoint.sh | grep -q '^REQUIRED_GPUS=1$'
          RUNPOD_POD_ID=test RUNPOD_DIRECT_TLS=auto PROFILE_VALIDATE_ONLY=1 MODEL_PROFILE=qwen36-27b-nvfp4 bash entrypoint.sh | grep -q '^REQUIRED_GPUS=1$'
          python3 -m json.tool runpod-template.json >/dev/null
          python3 -m json.tool runpod-template-qwen36.json >/dev/null
          python3 -c "import json; ps=[json.load(open(f)) for f in ('runpod-template.json','runpod-template-qwen36.json')]; assert all(p['ports'] == ['8000/http', '8443/tcp', '1111/http', '22/tcp'] and p['volumeMountPath'] == '/workspace' and p['env']['RUNPOD_DIRECT_TLS'] == 'auto' and p['env']['DESEC_TOKEN'].startswith('{{ RUNPOD_SECRET_') and not p['isServerless'] for p in ps); assert [p['env']['MODEL_PROFILE'] for p in ps] == ['glm52-exl3','qwen36-27b-nvfp4']"
  build:
    # PRs build without pushing, so a broken Dockerfile is caught before main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: free runner disk (base image is ~30GB; stock runners flake on space)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
