name: build-and-push
on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, landing.py, "requirements-soul.*", "runpod-template*.json", sshd_config, "patches/**", "scripts/**", "soul/**", "tests/**", .github/workflows/build.yml]
  pull_request:
    paths: [Dockerfile, entrypoint.sh, landing.py, "requirements-soul.*", "runpod-template*.json", sshd_config, "patches/**", "scripts/**", "soul/**", "tests/**", .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: shellcheck boot scripts
        run: shellcheck entrypoint.sh scripts/run-local-podman.sh scripts/bench-glm52-kld-tp4.sh scripts/recover_torch_extension_lock.sh scripts/jarvislabs_vm_bootstrap.sh scripts/glm52_lmcache_wrapper.sh scripts/acme_retry.sh
      - name: validate Python
        run: python3 -m py_compile landing.py scripts/*.py
      - name: fail-closed field-review patch applicator
        run: python3 tests/test_field_review_patches.py
      # Guards the destructive path: provider detection, the terminate
      # confirmation gates, the kill/anti-kill switch invariants, and the
      # session erase. Uses stubbed provider clients — it never contacts a
      # provider API and never destroys anything.
      - name: termination + switch tests
        run: python3 tests/test_termination.py
      # Guards the family preset layer: that the GLM serve line is unchanged,
      # that no GLM-ism leaks into another family, and that the measured rules
      # stay scoped to the family they were measured on.
      - name: model family tests
        run: python3 tests/test_families.py
      - name: immutable GG r25 source gate
        run: python3 tests/test_r25_base_gate.py
      - name: serial speculative scheduler warning patch
        run: python3 tests/test_vllm_serial_spec_warning_patch.py
      - name: mixed-K EXL3 patch
        run: python3 tests/test_exl3_mixk_patch.py
      - name: deSEC DNS-01 convergence guard
        run: python3 tests/test_desec_acme_guard.py
      # Catches "the knob exists but nothing reads it" — the class of defect that
      # was found twice by renting a GPU instead of by running a test.
      - name: knob wiring audit
        run: python3 tests/test_knob_wiring.py
      - name: gpu detection
        run: python3 tests/test_gpu_detect.py
      - name: persistent extension lock recovery
        run: python3 tests/test_extension_lock_recovery.py
      - name: bounded LMCache process and tier contract
        run: bash tests/test_lmcache_wrapper.sh
      - name: bounded ACME retry contract
        run: bash tests/test_acme_retry.sh
      # Keeps the live qualification instruments trustworthy before they are
      # used to spend GPU rental time.
      - name: serving benchmark and needle harness
        run: python3 tests/test_serving_tools.py
      - name: standalone NVFP4 MTP draft builder
        run: python3 tests/test_nvfp4_mtp_draft.py
      - name: OpenAI feature qualification harness
        run: python3 tests/test_feature_suite.py
      - name: structured output + speculative decode compatibility patch
        run: python3 tests/test_structured_output_patch.py
      - name: checkpoint reconciliation
        run: python3 tests/test_checkpoint_reconcile.py
      - name: embedded SOUL controller
        run: python3 tests/test_soul.py
      - name: validate profile compatibility and Runpod templates
        run: |
          CONFIG_SMOKE=1 SCRIPTS_DIR=scripts MODEL_PROFILE=glm52-exl3 bash entrypoint.sh | grep -q 'brandonmusic/GLM-5.2-EXL3-TR3-3.0bpw'
          CONFIG_SMOKE=1 SCRIPTS_DIR=scripts MODEL_PROFILE=qwen36-27b-nvfp4 bash entrypoint.sh | grep -q 'nvidia/Qwen3.6-27B-NVFP4'
          CONFIG_SMOKE=1 SCRIPTS_DIR=scripts MODEL_PROFILE=custom MODEL_ID=Qwen/Qwen3.5-0.8B bash entrypoint.sh | grep -q 'Qwen/Qwen3.5-0.8B'
          python3 -m json.tool runpod-template.json >/dev/null
          python3 -m json.tool runpod-template-qwen36.json >/dev/null
          python3 -c "import json; ps=[json.load(open(f)) for f in ('runpod-template.json','runpod-template-qwen36.json')]; assert all(p['ports'] == ['8000/http', '8443/tcp', '1111/http', '22/tcp'] and p['volumeMountPath'] == '/workspace' and p['env']['RUNPOD_DIRECT_TLS'] == 'auto' and 'DESEC_TOKEN' not in p['env'] and 'DESEC_DOMAIN' not in p['env'] and p['isPublic'] and not p['isServerless'] for p in ps); assert [p['env']['MODEL_PROFILE'] for p in ps] == ['glm52-exl3','qwen36-27b-nvfp4']"
  build:
    # PRs build without pushing, so a broken Dockerfile is caught before main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: free runner disk (base image is ~30GB; stock runners flake on space)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
